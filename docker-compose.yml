services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: methods_hub
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      APP_ENV: docker
      HTTP_PORT: "8081"
      DATABASE_URL: postgres://payments:payments@postgres:5432/methods_hub?sslmode=disable
      VAULT_ENCRYPTION_KEY: clave-solo-para-desarrollo-32-bytes!!
      LOG_LEVEL: info
    ports: ["8081:8081"]

volumes:
  pgdata:
